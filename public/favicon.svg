<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching premium dark theme -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    
    <!-- Rich Gold Gradient for the Monogram & Law Elements -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Platinum Accent Gradient for high premium look -->
    <linearGradient id="platGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Outer Protective Tech Shield (Clean, Sleek Geometric Borders) -->
  <path d="M 140,110 
           L 256,70 
           L 372,110 
           C 372,240 350,355 256,435 
           C 162,355 140,240 140,110 Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.85"
        filter="url(#glow)" />

  <!-- Inner Concentric Shield Line for depth -->
  <path d="M 160,130 
           L 256,96 
           L 352,130 
           C 352,240 332,335 256,405 
           C 180,335 160,240 160,130 Z" 
        fill="none" 
        stroke="url(#platGrad)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.3" />

  <!-- Center-piece: Stylized legal "Y" monogram (Yurid.uz) which integrates a law book, a sword of justice, and a strong pillar -->
  <g transform="translate(256, 250)" filter="url(#glow)">
    <!-- 1. The Central Pillar Stem (Represents Law and Stability) -->
    <!-- Beautifully tapered vertical column with step details -->
    <path d="M -16,10 L 16,10 L 12,130 L -12,130 Z" fill="url(#goldGrad)" />
    <!-- Pillar Base Baseplates -->
    <rect x="-30" y="130" width="60" height="12" rx="3" fill="url(#goldGrad)" />
    <rect x="-42" y="142" width="84" height="10" rx="2" fill="url(#platGrad)" opacity="0.9" />

    <!-- 2. Symmetrical Open Book / Falcon Wings forming the top of the "Y" (Trust and Transparency) -->
    <!-- Left Wing (Sleek geometric blade pointing up-left) -->
    <path d="M -16,10 
             L -135,-95 
             C -135,-95 -100,-115 -55,-85 
             L -10,-45
             Z" 
          fill="url(#goldGrad)" />
    <!-- Highlight strip inside Left Wing for 3D depth -->
    <path d="M -22,0 
             L -115,-80 
             L -100,-88
             L -18,-18
             Z" 
          fill="url(#platGrad)" opacity="0.35" />

    <!-- Right Wing (Sleek geometric blade pointing up-right) -->
    <path d="M 16,10 
             L 135,-95 
             C 135,-95 100,-115 55,-85 
             L 10,-45
             Z" 
          fill="url(#goldGrad)" />
    <!-- Highlight strip inside Right Wing for 3D depth -->
    <path d="M 22,0 
             L 115,-80 
             L 100,-88
             L 18,-18
             Z" 
          fill="url(#platGrad)" opacity="0.35" />

    <!-- 3. Central Decisive Point of Trust -->
    <!-- Elegant Diamond emblem at the focal core of the monogram, symbolizing integrity -->
    <polygon points="0,-35 15,-15 0,5 -15,-15" fill="url(#platGrad)" />
    <polygon points="0,-30 10,-15 0,0 -10,-15" fill="url(#goldGrad)" />
    
    <!-- Top Crest Crown Element (Geometric, representative of high authority/state registry) -->
    <path d="M -20,-140 L 0,-155 L 20,-140 L 10,-125 L -10,-125 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Elegant Diagonal Shimmer / Light Reflection -->
  <path d="M 145,115 C 240,95 330,110 387,130 C 375,170 300,240 180,180 Z" fill="#ffffff" opacity="0.08" />
</svg>
