<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching premium dark theme -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    
    <!-- Gold Gradient for the Emblem -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Metallic Highlight Gradient -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Shield Border (Highly Minimalist & Symmetrical) -->
  <path d="M 120,120 
           C 200,90 312,90 392,120 
           C 392,260 370,360 256,430 
           C 142,360 120,260 120,120 Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Scale Column (Center Pillar) -->
  <g transform="translate(256, 260)" fill="url(#goldGrad)">
    <!-- Pillar Base -->
    <path d="M -30,120 L 30,120 L 20,105 L -20,105 Z" />
    <!-- Pillar Shaft -->
    <rect x="-8" y="-90" width="16" height="200" rx="4" />
    <!-- Pillar Cap -->
    <circle cx="0" cy="-105" r="14" />
    
    <!-- Balance Beam (Crossbar) -->
    <path d="M -110,-70 C -60,-82 60,-82 110,-70 C 115,-68 115,-62 110,-60 C 60,-48 -60,-48 -110,-60 C -115,-62 -115,-68 -110,-70 Z" />
    
    <!-- Balance Axis Pins -->
    <circle cx="0" cy="-65" r="5" fill="#1e293b" />
    <circle cx="-100" cy="-65" r="4" />
    <circle cx="100" cy="-65" r="4" />

    <!-- Left Scale Plate & Cords -->
    <g transform="translate(-100, -65)">
      <!-- Left Cord 1 -->
      <line x1="0" y1="0" x2="-25" y2="90" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
      <!-- Left Cord 2 -->
      <line x1="0" y1="0" x2="25" y2="90" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
      <!-- Left Plate -->
      <path d="M -35,90 C -35,105 35,105 35,90 Z" />
    </g>

    <!-- Right Scale Plate & Cords -->
    <g transform="translate(100, -65)">
      <!-- Right Cord 1 -->
      <line x1="0" y1="0" x2="-25" y2="90" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
      <!-- Right Cord 2 -->
      <line x1="0" y1="0" x2="25" y2="90" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
      <!-- Right Plate -->
      <path d="M -35,90 C -35,105 35,105 35,90 Z" />
    </g>

    <!-- Center Accent Diamond -->
    <polygon points="0,-45 8,-35 0,-25 -8,-35" fill="url(#goldGrad)" />
  </g>
  
  <!-- Subtle Sleek Diagonal Reflection Layer -->
  <path d="M 125,125 C 220,105 320,120 387,140 C 375,180 320,250 180,180 Z" fill="url(#highlightGrad)" opacity="0.12" />
</svg>
